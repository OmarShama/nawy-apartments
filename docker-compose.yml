services:
  db:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nawy
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./nawy-apartment-be
      dockerfile: Dockerfile
    container_name: backend
    restart: always
    depends_on:
      - db
    ports:
      - "3005:3005"
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nawy?schema=nawy_apartments_schema
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_NAME: nawy
      DB_SCHEMA: nawy_apartment
      STORAGE_DRIVER: local
      MAX_IMAGES: 10
      PORT: 3005
    volumes:
      - ./nawy-apartment-be:/app
      - /app/node_modules
      - ./nawy-apartment-be/uploads:/app/uploads 

  frontend:
    build:
      context: ./nawy-apartment-fe-app
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://backend:3005
        API_URL: http://backend:3005
    container_name: frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    volumes:
      - /app/node_modules

volumes:
  pgdata:
